<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Redirecionando para o WhatsApp | Débora Carvalho Advocacia</title>
<meta name="theme-color" content="#2F4147">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&amp;family=Montserrat:wght@300;400;500;600&amp;display=swap">
<!-- Espaço reservado para evento de conversão (Meta Pixel "Lead" / Google Ads) quando os IDs estiverem definidos. -->
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#2F4147;color:#D3DCDE;font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;position:relative}
.glow{position:absolute;inset:-20%;background:radial-gradient(closest-side at 70% 20%,rgba(253,209,161,.14),transparent 70%);pointer-events:none}
.swoosh{position:absolute;left:-10%;width:120%;height:auto;fill:none;stroke:#FDD1A1;stroke-width:1.2;opacity:.5;pointer-events:none}
.swoosh path{stroke-dasharray:1600;animation:draw 2.4s cubic-bezier(.6,0,.2,1) .2s both}
.s1{top:6%}.s2{bottom:4%;transform:scaleX(-1)}
.box{position:relative;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;animation:fade .5s ease both}
.logo{width:230px;height:auto;margin-bottom:14px}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.r-bg{stroke:rgba(255,255,255,.1)}
.r-fg{stroke:#FDD1A1;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;animation:ring 3s linear forwards}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;font-size:56px;font-weight:400;color:#fff}
h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:38px;line-height:1.12;color:#FDD1A1}
h1 span{color:#fff}
h1::after{content:'';display:block;width:56px;height:1.5px;background:#FDD1A1;margin:18px auto 0}
p{margin:0;line-height:1.7;font-weight:300}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 28px;margin-top:8px;background:#FDD1A1;color:#223136;border-radius:14px;font-weight:600;font-size:15px;text-decoration:none;transition:transform .3s ease}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:20px;height:20px}
.back{color:#AEBDC1;font-size:13.5px;text-underline-offset:4px;min-height:44px;display:inline-flex;align-items:center}
[hidden]{display:none !important}
@keyframes ring{to{stroke-dashoffset:0}}
@keyframes draw{from{stroke-dashoffset:1600}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.box,.r-fg,.swoosh path{animation:none}.r-fg{stroke-dashoffset:0}}
</style>
</head>
<body>
<span class="glow" aria-hidden="true"></span>
<svg class="swoosh s1" viewBox="0 0 800 220" aria-hidden="true"><path d="M0 170 C 180 150, 330 60, 520 40 S 760 30, 800 52"></path></svg>
<svg class="swoosh s2" viewBox="0 0 800 220" aria-hidden="true"><path d="M0 200 C 220 190, 420 120, 600 70 S 760 20, 800 10"></path></svg>
<main class="box">
<img class="logo" src="/assets/logo-claro.png" alt="Débora Carvalho Advocacia" width="977" height="415">
<div class="ring" id="ring" aria-hidden="true"><svg viewBox="0 0 120 120"><circle class="r-bg" cx="60" cy="60" r="54"></circle><circle class="r-fg" cx="60" cy="60" r="54"></circle></svg><b id="count">3</b></div>
<h1 id="titulo">Obrigado pelo contato</h1>
<p id="texto" aria-live="polite">Estamos te levando para o WhatsApp do escritório. Em instantes você poderá apresentar o seu caso.</p>
<a class="btn" id="wa" href="#" rel="noopener">
<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"></path></svg>
Abrir WhatsApp
</a>
<a class="back" href="/previdenciario">Voltar para a página</a>
</main>
<script>
(function(){
  // ====== CONFIGURAÇÃO ======
  // WhatsApp oficial do escritório (o número exclusivo do agente de IA): só dígitos, com 55 + DDD.
  // Ex.: '5571999999999'. Enquanto estiver vazio, a página agradece e não redireciona.
  var WHATSAPP_NUMERO = '';
  var ESPERA_MS = 3000;
  // ==========================

  var nome = '', tema = '';
  try { nome = sessionStorage.getItem('dc_nome') || ''; tema = sessionStorage.getItem('dc_tema') || ''; } catch(e){}
  var primeiro = nome.split(' ')[0];
  var t = document.getElementById('titulo');
  if (primeiro) {
    t.textContent = 'Obrigado, ';
    var s = document.createElement('span'); s.textContent = primeiro; t.appendChild(s);
  }

  var msg = 'Olá!' + (nome ? ' Meu nome é ' + nome + '.' : '') +
    ' Vim pelo site e gostaria de uma orientação sobre Direito Previdenciário' +
    (tema ? ' (' + tema + ')' : '') + '.';

  // Espaço para eventos de conversão (Meta Pixel "Lead" / Google Ads), quando instalados.

  var numero = WHATSAPP_NUMERO.replace(/\D/g, '');
  var texto = document.getElementById('texto');
  var wa = document.getElementById('wa');
  if (numero.length < 12) {
    document.getElementById('ring').hidden = true;
    wa.hidden = true;
    texto.textContent = 'Recebemos seus dados. A equipe do escritório vai falar com você pelo WhatsApp informado.';
    if (window.console) console.warn('[redirect] WHATSAPP_NUMERO não configurado.');
    return;
  }
  var url = 'https://wa.me/' + numero + '?text=' + encodeURIComponent(msg);
  wa.href = url;

  var n = Math.round(ESPERA_MS / 1000), el = document.getElementById('count');
  var timer = setInterval(function(){
    n -= 1;
    if (n > 0) { el.textContent = n; return; }
    clearInterval(timer);
    el.textContent = '0';
    texto.textContent = 'Se o WhatsApp não abriu automaticamente, toque no botão abaixo.';
    location.href = url;
  }, 1000);
})();
</script>
</body>
</html>
